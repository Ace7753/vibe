services:
  spotdl-app:
    build:
      context: .
      args:
        SPOTDL_REPO: ${SPOTDL_REPO:-https://github.com/spotDL/spotify-downloader}
        SPOTDL_REF: ${SPOTDL_REF:-}
    image: spotdl-app:latest
    ports:
      - "8080:8080"
    volumes:
      - ${MUSIC_DIR:-./downloads}:/downloads
      - ./config:/config
    environment:
      DOWNLOAD_DIR: /downloads
      XDG_CONFIG_HOME: /config
      XDG_CACHE_HOME: /config/.cache
    restart: unless-stopped
